name: Storyglot Android app

# Builds the installable Android app (APK) and publishes it as a release,
# so it can be downloaded straight onto the tablet.
on:
  push:
    paths:
      - 'storyglot/**'
      - '.github/workflows/storyglot-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storyglot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storyglot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: storyglot/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Storyglot.apk"

      - name: Check the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Storyglot.apk"
          "$BT/aapt2" dump badging "$GITHUB_WORKSPACE/Storyglot.apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-permission)"
          unzip -l "$GITHUB_WORKSPACE/Storyglot.apk" | grep -E "assets/public/(index.html|capacitor.js)|assets/capacitor.plugins.json"
          unzip -p "$GITHUB_WORKSPACE/Storyglot.apk" assets/capacitor.plugins.json

      - uses: actions/upload-artifact@v4
        with:
          name: Storyglot-apk
          path: Storyglot.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release delete storyglot-apk --yes --cleanup-tag || true
          gh release create storyglot-apk Storyglot.apk \
            --target "$GITHUB_SHA" \
            --title "Storyglot for Android (build ${{ github.run_number }})" \
            --notes "Download **Storyglot.apk** on the tablet and open it to install or update. Updating keeps your progress."
