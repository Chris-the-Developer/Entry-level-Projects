<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storyglot</title>
<meta name="description" content="Learn a language through reading and listening to texts you choose.">
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f6fb; --card:#ffffff; --ink:#1c1d2b; --mute:#696d84; --line:#e3e4ee; --soft:#eeeef7;
  --accent:#5b5bd6; --accent-ink:#fff; --danger:#c2412d; --ok:#1f9d57;
  --new:#d6e4ff; --g1:#8fdfab; --g2:#bdeecd; --g3:#e1f7e8; --speak:#ffe08a; --sent:#eeeef7;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
:root[data-theme=dark]{
  --bg:#111219; --card:#1a1c26; --ink:#e9e9f2; --mute:#9a9db3; --line:#2b2e3d; --soft:#232534;
  --accent:#9494f7; --accent-ink:#111219; --danger:#f08a76; --ok:#5fd08f;
  --new:#27407a; --g1:#1f7043; --g2:#1a5032; --g3:#173826; --speak:#7a5c00; --sent:#232534;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{font:700 1.5rem var(--sans);margin:0;letter-spacing:-.01em}
h2{font:600 1.05rem var(--sans);margin:0 0 .6rem}
#main{max-width:880px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.pill{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap;border:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px}
.btn.primary,.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute);font-size:.9rem}
label.f{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mute)}
label.f>input,label.f>select,label.f>textarea,.inp{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1rem;min-height:44px}
label.chk{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:.95rem}
label.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
textarea{min-height:220px;resize:vertical;font-family:var(--serif)!important;line-height:1.5}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:10px;min-height:44px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.banner{background:var(--g3);border:1px solid var(--g1);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}
progress{width:100%;height:10px;accent-color:var(--accent)}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}

/* home + library */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile b{display:block;font:700 1.6rem var(--sans);letter-spacing:-.02em}
.tile span{font-size:.8rem;color:var(--mute)}
.goal b{font:700 2rem var(--sans);letter-spacing:-.02em}
.lesson{display:flex;gap:12px;align-items:center;cursor:pointer}
.lesson h3{margin:0 0 2px;font:600 1.05rem var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--accent)} .bar .l{background:var(--g1)} .bar .n{background:var(--new)}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}

/* reader */
.readbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:8px}
.readbar h1{font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readbar .btn{padding:6px 12px}
#text{font-family:var(--serif);line-height:1.95;padding-bottom:40px}
#text p{margin:0 0 1em}
.s{border-radius:5px}
.s.cur,.line.cur .lt{background:var(--sent)}
.w{border-radius:5px;padding:1px 1px;cursor:pointer}
.w.st0{background:var(--new)} .w.st1{background:var(--g1)} .w.st2{background:var(--g2)} .w.st3{background:var(--g3)}
.w.sp{background:var(--speak)!important}
.w.sel{outline:2px solid var(--accent)}
.line{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.line .tr{font:italic .8em/1.5 var(--sans);color:var(--mute);margin-top:2px;cursor:pointer}
.mini{border:1px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;flex:none;font-size:.85rem}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:4px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#player .btn{padding:8px 14px}
#player .play{min-width:72px;font-size:1.1rem}
#player select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;min-height:44px}

/* word sheet */
#sheet{position:fixed;z-index:20;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:14px 16px;max-height:60vh;overflow:auto}
@media (min-width:1000px){#sheet{left:auto;right:16px;bottom:84px;width:390px;border:1px solid var(--line);border-radius:18px}}
#sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sheet .hd b{font:600 1.5rem var(--serif);flex:1;min-width:0;overflow-wrap:anywhere}
#sheet input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:1.05rem;margin-bottom:10px}
.status{display:flex;gap:6px;margin-bottom:10px}
.status button{flex:1;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:4px;background:var(--card);font-size:.8rem}
.status .b1{background:var(--g1)} .status .b2{background:var(--g2)} .status .b3{background:var(--g3)}
.status button.on{outline:3px solid var(--accent);font-weight:700}
.ctx{font:1rem/1.5 var(--serif);border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.ctx small{display:block;font:italic .85rem var(--sans);color:var(--mute);margin-top:4px}

/* navigation: bottom bar on narrow screens, side rail on wide ones */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;max-width:160px;border:0;background:none;padding:10px 4px;min-height:56px;font-size:.78rem;color:var(--mute);position:relative}
#tabs button.on{color:var(--accent);font-weight:700}
#tabs button svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--danger);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px;line-height:1.5}
@media (min-width:900px){
  #tabs{right:auto;top:0;width:96px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:18px 6px}
  #tabs button{flex:none;max-width:none;width:100%;border-radius:12px}
  #tabs button.on{background:var(--soft)}
  body.nav{padding-left:96px}
  body.nav #main{padding-bottom:32px}
  body.nav #toast{bottom:32px}
}

/* flashcards */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.modes button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;min-height:72px}
.modes button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.modes b{display:block} .modes small{color:var(--mute)}
.flash{text-align:center;padding:28px 16px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.flash .word{font:600 2.3rem var(--serif);overflow-wrap:anywhere}
.flash .mean{font-size:1.4rem;color:var(--accent)}
.flash .ctx{text-align:left;margin:8px auto;max-width:560px;font-size:1.15rem}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade .btn{padding:10px 4px}
.grade small{display:block;color:var(--mute);font-size:.7rem}

.wl{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wl b{font:600 1.05rem var(--serif)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:330px}
.days i{aspect-ratio:1;border-radius:8px;background:var(--soft);font:normal .7rem var(--sans);display:grid;place-items:center;color:var(--mute)}
.days i.a{background:var(--accent);color:var(--accent-ink);font-weight:700}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:8px 0}
.split i{display:block;height:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:90vw;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.3)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="main"></div>
<aside id="sheet" hidden></aside>
<div id="player" hidden></div>
<nav id="tabs" hidden></nav>
<div id="toast" hidden></div>

<script>
'use strict';
/* ============ Storyglot — single-file language reader ============ */
const KEY = 'storyglot.v1', DAY = 864e5;
// code, name, speech locale, MyMemory code (if different)
const LANGS = [
  ['en','English','en-US'],['es','Spanish','es-ES'],['fr','French','fr-FR'],['de','German','de-DE'],
  ['it','Italian','it-IT'],['pt','Portuguese','pt-PT'],['nl','Dutch','nl-NL'],['sv','Swedish','sv-SE'],
  ['no','Norwegian','nb-NO'],['da','Danish','da-DK'],['fi','Finnish','fi-FI'],['pl','Polish','pl-PL'],
  ['cs','Czech','cs-CZ'],['sk','Slovak','sk-SK'],['hu','Hungarian','hu-HU'],['ro','Romanian','ro-RO'],
  ['bg','Bulgarian','bg-BG'],['hr','Croatian','hr-HR'],['sr','Serbian','sr-RS'],['uk','Ukrainian','uk-UA'],
  ['ru','Russian','ru-RU'],['el','Greek','el-GR'],['tr','Turkish','tr-TR'],['ar','Arabic','ar-SA'],
  ['he','Hebrew','he-IL'],['fa','Persian','fa-IR'],['hi','Hindi','hi-IN'],['id','Indonesian','id-ID'],
  ['vi','Vietnamese','vi-VN'],['th','Thai','th-TH'],['zh','Chinese','zh-CN','zh-CN'],['ja','Japanese','ja-JP'],
  ['ko','Korean','ko-KR']
];
const langName = c => (LANGS.find(l => l[0] === c) || [c, c])[1];
const langLocale = c => (LANGS.find(l => l[0] === c) || [c, c, c])[2];
const mmCode = c => (LANGS.find(l => l[0] === c) || [])[3] || c;
const NOSPACE = new Set(['zh', 'ja', 'th']);

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = n => Math.round(n).toLocaleString();

/* ---------------- state & storage (IndexedDB, falling back to localStorage) ---------------- */
const DEFAULTS = () => ({
  settings: {native:'en', target:'', rate:0.9, voice:'', provider:'auto', email:'', ltUrl:'', ltKey:'', goal:1000, font:22, theme:'auto', autoKnown:true},
  lessons: [], words: {}, cache: {}, stats: {days: {}}
});
let S = DEFAULTS(), memOnly = false, saveTimer = 0, idb = null;
const merge = d => { const def = DEFAULTS(); return {...def, ...d, settings: {...def.settings, ...d.settings}, stats: {days: {}, ...d.stats}}; };
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('storyglot', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
    setTimeout(() => rej(new Error('timeout')), 4000);
  });
}
const idbGet = k => new Promise((res, rej) => { const r = idb.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbPut = (k, v) => new Promise((res, rej) => { const t = idb.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error); });
async function load() {
  let d = null;
  try { idb = await idbOpen(); d = await idbGet(KEY); } catch (e) { idb = null; }
  if (!d) { try { const raw = localStorage.getItem(KEY); if (raw) d = JSON.parse(raw); } catch (e) { if (!idb) memOnly = true; } }
  if (d) S = merge(d);
}
function saveNow() {
  clearTimeout(saveTimer); saveTimer = 0;
  if (idb) { idbPut(KEY, S).catch(() => toast('Could not save on this device. Export a backup from Settings.')); return; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!memOnly) { memOnly = true; toast('Could not save on this device. Export a backup from Settings.'); } }
}
function save() { if (!saveTimer) saveTimer = setTimeout(saveNow, 400); }
addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });

// word entry: s = 0 seen only, 1 new, 2 familiar, 3 known, 4 mastered, 5 ignored; 1-3 have a flashcard
const dict = lang => (S.words[lang] ||= {});
const stOf = (lang, k) => { const e = dict(lang)[k]; return e ? e.s : 0; };
const isKnown = s => s === 3 || s === 4;
function bump(field, n = 1) { if (!n) return; const d = (S.stats.days[today()] ||= {}); d[field] = (d[field] || 0) + n; save(); }
function streak() {
  let n = 0; const d = new Date();
  if (!S.stats.days[today(d)]) d.setDate(d.getDate() - 1);
  while (S.stats.days[today(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function counts(lang) {
  let known = 0, cards = 0, due = 0; const now = Date.now();
  for (const e of Object.values(dict(lang))) {
    if (isKnown(e.s)) known++;
    if (e.s >= 1 && e.s <= 3) { cards++; if ((e.due || 0) <= now) due++; }
  }
  return {known, cards, due};
}
function totals() {
  const t = {read: 0, heard: 0, listen: 0, reviews: 0, newW: 0, reinf: 0};
  for (const d of Object.values(S.stats.days)) for (const k in t) t[k] += d[k] || 0;
  t.input = t.read + t.heard;
  return t;
}
// Rough level estimate from total words of input (reading + listening) inside the app.
const LEVELS = [['A1', 0], ['A2', 30000], ['B1', 120000], ['B2', 350000], ['C1', 800000], ['C2', 1600000]];
function level(input) {
  let i = 0; while (i + 1 < LEVELS.length && input >= LEVELS[i + 1][1]) i++;
  const next = LEVELS[i + 1];
  return {name: LEVELS[i][0], next: next && next[0], pct: next ? 100 * (input - LEVELS[i][1]) / (next[1] - LEVELS[i][1]) : 100, left: next ? next[1] - input : 0};
}

/* ---------------- text segmentation ---------------- */
const segCache = {};
function segmenter(lang, granularity) {
  const k = lang + granularity;
  if (!(k in segCache)) { try { segCache[k] = new Intl.Segmenter(lang, {granularity}); } catch (e) { segCache[k] = null; } }
  return segCache[k];
}
function splitSents(par, lang) {
  const s = segmenter(lang, 'sentence');
  const out = s ? [...s.segment(par)].map(x => x.segment)
    : (par.match(/[^.!?。！？]+[.!?。！？]+["'”’»)\]]*\s*|[^.!?。！？]+$/g) || [par]);
  return out.map(x => x.trim()).filter(Boolean);
}
function tokens(t, lang) {
  const s = segmenter(lang, 'word'), out = [];
  if (s) { for (const x of s.segment(t)) out.push({w: x.segment, o: x.index, word: !!x.isWordLike && /\p{L}/u.test(x.segment)}); return out; }
  let last = 0;
  for (const m of t.matchAll(/[\p{L}\p{M}][\p{L}\p{M}'’-]*/gu)) {
    if (m.index > last) out.push({w: t.slice(last, m.index), o: last, word: false});
    out.push({w: m[0], o: m.index, word: true}); last = m.index + m[0].length;
  }
  if (last < t.length) out.push({w: t.slice(last), o: last, word: false});
  return out;
}
const keyOf = (w, lang) => { try { return w.toLocaleLowerCase(lang); } catch (e) { return w.toLowerCase(); } };
const sentWords = (t, lang) => tokens(t, lang).filter(x => x.word).map(x => keyOf(x.w, lang));
function lessonWords(L) { const out = []; for (const s of L.sents) out.push(...sentWords(s.t, L.lang)); return out; }

/* ---------------- translation ---------------- */
const sessCache = new Map(), devT = {};
function decodeEntities(s) { if (!/&[#\w]+;/.test(s)) return s; const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function chunks(text, max = 450) {
  const enc = new TextEncoder(), size = s => enc.encode(s).length, out = []; let cur = '';
  for (const piece of text.split(/(\s+)/)) {
    if (cur && size(cur + piece) > max) { out.push(cur); cur = ''; }
    if (size(piece) > max) { for (const ch of piece) { if (size(cur + ch) > max) { out.push(cur); cur = ''; } cur += ch; } }
    else cur += piece;
  }
  if (cur.trim()) out.push(cur);
  return out;
}
async function onDevice(text, from, to) {            // Chrome's built-in on-device translator, where installed
  if (!('Translator' in self)) return null;
  const k = from + '>' + to;
  const within = (pr, ms) => Promise.race([pr, new Promise(r => setTimeout(() => r(null), ms))]);   // the API can hang; never block on it
  if (!(k in devT)) devT[k] = (async () => {
    try {
      if (await within(self.Translator.availability({sourceLanguage: from, targetLanguage: to}), 2000) !== 'available') return null;
      return await within(self.Translator.create({sourceLanguage: from, targetLanguage: to}), 8000);
    } catch (e) { return null; }
  })();
  const tr = await devT[k];
  if (!tr) return null;
  try { return await tr.translate(text); } catch (e) { return null; }
}
async function myMemory(text, from, to) {
  const out = [];
  for (const part of chunks(text)) {
    const u = new URL('https://api.mymemory.translated.net/get');
    u.searchParams.set('q', part.trim()); u.searchParams.set('langpair', mmCode(from) + '|' + mmCode(to));
    if (S.settings.email) u.searchParams.set('de', S.settings.email);
    let j;
    try { const r = await fetch(u); j = await r.json(); }
    catch (e) { throw new Error(navigator.onLine === false ? 'You are offline — translation needs an internet connection.' : 'Could not reach the translation service.'); }
    const t = j && j.responseData && j.responseData.translatedText;
    const detail = String((j && j.responseDetails) || t || '');
    if (!t || Number(j.responseStatus) !== 200 || /^MYMEMORY WARNING/i.test(t)) {
      if (/WARNING|LIMIT|QUOTA/i.test(detail) || Number(j && j.responseStatus) === 429)
        throw new Error('The free daily translation limit is used up. Add your email in Settings for a 10× higher limit, or try again tomorrow.');
      throw new Error('Translation failed' + (detail ? ': ' + detail.slice(0, 120) : '.'));
    }
    out.push(decodeEntities(t));
  }
  return out.join(' ');
}
async function libre(text, from, to) {
  const base = (S.settings.ltUrl || '').trim().replace(/\/+$/, '').replace(/\/translate$/, '');
  if (!base) throw new Error('Set the LibreTranslate server address in Settings.');
  let r;
  try {

  reveal() { RV.shown = true; render(); },
  sayCard() { speak(RV.queue[0], S.settings.target, {rate: Math.min(S.settings.rate, 0.9)}); },
  grade: el => grade(el.dataset.g),
  wordRow(el) { const k = el.dataset.k; R.sel = {lang: S.settings.target, k, surface: k, i: null, tr: '', busy: false, err: ''}; drawSheet(); },
  csv() { const q = s => '"' + String(s || '').replace(/"/g, '""') + '"'; const t = S.settings.target;
    const rows = Object.entries(dict(t)).filter(([, e]) => e.s >= 1 && e.s <= 3).map(([k, e]) => [k, e.tr, e.ctx].map(q).join(','));
    if (!rows.length) return toast('No flashcards to export yet.');
    download(`storyglot-${t}-words.csv`, '﻿' + rows.join('\r\n'), 'text/csv'); },
  testVoice() { const t = S.settings.target; const L = S.lessons.find(l => l.lang === t); speak(L ? L.sents[0].t : langName(t), t); },
  backup() { saveNow(); download(`storyglot-backup-${today()}.json`, JSON.stringify(S), 'application/json'); },
  reset() { if (confirm('Erase all lessons, words and progress on this device? This cannot be undone.')) { S = DEFAULTS(); saveNow(); applyTheme(); go('welcome'); } }
};
document.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (w && view === 'reader') {
    const sl = getSelection(); if (sl && !sl.isCollapsed) return;          // finishing a phrase selection, not a tap
    const L = cur(), s = w.closest('.s');
    document.querySelectorAll('.w.sel').forEach(x => x.classList.remove('sel')); w.classList.add('sel');
    openWord(L.lang, w.dataset.k, w.textContent, s ? +s.dataset.i : null);
    return;
  }
  const el = e.target.closest('[data-a]');
  if (el) { const f = ACT[el.dataset.a]; if (f) { if (el.closest('.lesson') && el.dataset.a !== 'open') e.stopPropagation(); f(el); } return; }
  if (R.sel && !e.target.closest('#sheet') && !e.target.closest('#player')) closeSheet();
}, true);
document.addEventListener('change', e => {
  const t = e.target, s = S.settings;
  switch (t.id) {
    case 'p-rate': s.rate = +t.value; save(); if (P.playing) playFrom(P.i); break;
    case 's-native': if (t.value === s.target) { toast('Choose two different languages.'); render(); break; } s.native = t.value; saveNow(); break;
    case 's-target': if (t.value === s.native) { toast('Choose two different languages.'); render(); break; } s.target = t.value; s.voice = ''; RV.active = false; saveNow(); render(); break;
    case 's-goal': s.goal = Math.max(50, Math.min(50000, Math.round(+t.value) || 1000)); save(); break;
    case 's-auto': s.autoKnown = t.checked; save(); break;
    case 's-theme': s.theme = t.value; save(); applyTheme(); break;
    case 's-voice': s.voice = t.value; save(); break;
    case 's-rate': s.rate = +t.value; save(); break;
    case 's-prov': s.provider = t.value; saveNow(); render(); break;
    case 's-email': s.email = t.value.trim(); save(); break;
    case 's-lturl': s.ltUrl = t.value.trim(); save(); break;
    case 's-ltkey': s.ltKey = t.value.trim(); save(); break;
    case 'w-st': WF.st = t.value; refreshWords(); break;
    case 's-mean': if (R.sel) { const e2 = dict(R.sel.lang)[R.sel.k]; if (e2 && e2.added) { e2.tr = t.value.trim(); save(); refreshWords(); } else R.sel.tr = t.value.trim(); } break;
    case 'a-file': { const f = t.files[0]; if (!f) break;
      const name = f.name.replace(/\.[^.]+$/, ''), keep = $('#a-title').value, epub = /\.epub$/i.test(f.name);
      (epub ? f.arrayBuffer().then(readEpub) : f.text().then(text => ({title: '', text})))
        .then(b => { A.text = b.text; A.title = keep || b.title || name; if (epub) A.native = false; if (view === 'add') render(); })
        .catch(err => toast('Could not open that file: ' + err.message));
      break; }
    case 's-import': { const f = t.files[0]; if (!f) break; f.text().then(txt => {
      try { const d = JSON.parse(txt); if (!d || !d.settings || !Array.isArray(d.lessons)) throw 0;
        if (!confirm('Replace everything on this device with this backup?')) return;
        S = merge(d); saveNow(); applyTheme(); go('home'); toast('Backup restored.');
      } catch (err) { toast('That file is not a Storyglot backup.'); } }); break; }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'w-q') { WF.q = e.target.value; refreshWords(); }
  if (e.target.id === 's-rate') $('#s-rate-v').textContent = (+e.target.value).toFixed(2).replace(/0$/, '') + '×';
});

/* ---------------- boot ---------------- */
load().then(() => { applyTheme(); render(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
