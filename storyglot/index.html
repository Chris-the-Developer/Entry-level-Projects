<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storyglot</title>
<meta name="description" content="Read, listen and learn a language from any text.">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#23201a; --mute:#756d5f; --line:#e2d9c8;
  --accent:#1f6f5c; --accent-ink:#fff; --danger:#b3402e;
  --new:#cfe3ff; --l1:#ffd766; --l2:#ffe699; --l3:#fff3cc; --speak:#bfe8d6; --sent:#efe7d6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16181c; --card:#1f2228; --ink:#ece7dc; --mute:#9a9486; --line:#33373f;
  --accent:#5cc2a6; --accent-ink:#0d1f1a; --danger:#ef8a78;
  --new:#234a7a; --l1:#7a5c00; --l2:#5c4708; --l3:#40340f; --speak:#1f5a48; --sent:#262a31;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{font:600 1.5rem var(--serif);margin:0}
h2{font:600 1.05rem var(--sans);margin:0 0 .6rem}
#main{max-width:860px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.pill{font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--sent);color:var(--mute);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute);font-size:.9rem}
label.f{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mute)}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem}
textarea{min-height:220px;resize:vertical;font-family:var(--serif)!important;line-height:1.5}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:var(--card);padding:10px;min-height:44px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.banner{background:var(--l3);border:1px solid var(--l1);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}

/* library */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:600 1.5rem var(--serif)}
.tile span{font-size:.8rem;color:var(--mute)}
.lesson{display:flex;gap:12px;align-items:center;cursor:pointer}
.lesson h3{margin:0 0 2px;font:600 1.1rem var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .grow{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--accent)} .bar .l{background:var(--l1)} .bar .n{background:var(--new)}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}

/* reader */
.readbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:8px}
.readbar h1{font-size:1.1rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readbar .btn{padding:6px 12px}
#text{font-family:var(--serif);line-height:1.9;padding-bottom:40px}
#text p{margin:0 0 1em}
.s{border-radius:4px}
.s.cur,.line.cur .lt{background:var(--sent)}
.w{border-radius:4px;padding:1px 1px;cursor:pointer}
.w.st0{background:var(--new)} .w.st1{background:var(--l1)} .w.st2{background:var(--l2)} .w.st3{background:var(--l3)}
.w.sp{background:var(--speak)!important}
.w.sel{outline:2px solid var(--accent)}
.line{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.line .lt{border-radius:4px}
.line .tr{font:italic .8em/1.5 var(--sans);color:var(--mute);margin-top:2px;cursor:pointer}
.mini{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;flex:none;font-size:.8rem}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:4px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#player .btn{padding:8px 14px}
#player .play{min-width:72px;font-size:1.1rem}
#player select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;min-height:44px}

/* word sheet */
#sheet{position:fixed;z-index:20;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:14px 16px;max-height:60vh;overflow:auto}
@media (min-width:1000px){#sheet{left:auto;right:16px;bottom:84px;width:380px;border:1px solid var(--line);border-radius:16px}}
#sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sheet .hd b{font:600 1.5rem var(--serif);flex:1;min-width:0;overflow-wrap:anywhere}
#sheet input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.05rem;margin-bottom:10px}
.status{display:flex;gap:6px;margin-bottom:10px}
.status button{flex:1;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:4px;background:var(--card);font-size:.8rem}
.status .b1{background:var(--l1)} .status .b2{background:var(--l2)} .status .b3{background:var(--l3)}
.status button.on{outline:3px solid var(--accent);font-weight:700}
.ctx{font:1rem/1.5 var(--serif);border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.ctx small{display:block;font:italic .85rem var(--sans);color:var(--mute);margin-top:4px}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;max-width:160px;border:0;background:none;padding:10px 4px;min-height:56px;font-size:.8rem;color:var(--mute);position:relative}
#tabs button.on{color:var(--accent);font-weight:700}
#tabs button svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--danger);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px;line-height:1.5}

/* review */
.flash{text-align:center;padding:28px 16px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.flash .word{font:600 2.4rem var(--serif);overflow-wrap:anywhere}
.flash .mean{font-size:1.4rem;color:var(--accent)}
.flash .ctx{text-align:left;margin:8px auto;max-width:560px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade .btn{padding:10px 4px}
.grade small{display:block;color:var(--mute);font-size:.7rem}

/* words */
.wl{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wl b{font:600 1.05rem var(--serif)}
.wl .grow{flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days i{width:26px;height:26px;border-radius:6px;background:var(--line);font:normal .65rem/26px var(--sans);text-align:center;color:var(--mute)}
.days i.a{background:var(--accent);color:var(--accent-ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.3)}
progress{width:100%;height:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="main"></div>
<aside id="sheet" hidden></aside>
<div id="player" hidden></div>
<nav id="tabs"></nav>
<div id="toast" hidden></div>

<script>
'use strict';
/* ============ Storyglot — single-file language reader ============ */
const KEY = 'storyglot.v1', DAY = 864e5;
// code, name, speech locale, MyMemory code (if different)
const LANGS = [
  ['en','English','en-US'],['es','Spanish','es-ES'],['fr','French','fr-FR'],['de','German','de-DE'],
  ['it','Italian','it-IT'],['pt','Portuguese','pt-PT'],['nl','Dutch','nl-NL'],['sv','Swedish','sv-SE'],
  ['no','Norwegian','nb-NO'],['da','Danish','da-DK'],['fi','Finnish','fi-FI'],['pl','Polish','pl-PL'],
  ['cs','Czech','cs-CZ'],['sk','Slovak','sk-SK'],['hu','Hungarian','hu-HU'],['ro','Romanian','ro-RO'],
  ['bg','Bulgarian','bg-BG'],['hr','Croatian','hr-HR'],['sr','Serbian','sr-RS'],['uk','Ukrainian','uk-UA'],
  ['ru','Russian','ru-RU'],['el','Greek','el-GR'],['tr','Turkish','tr-TR'],['ar','Arabic','ar-SA'],
  ['he','Hebrew','he-IL'],['fa','Persian','fa-IR'],['hi','Hindi','hi-IN'],['id','Indonesian','id-ID'],
  ['vi','Vietnamese','vi-VN'],['th','Thai','th-TH'],['zh','Chinese','zh-CN','zh-CN'],['ja','Japanese','ja-JP'],
  ['ko','Korean','ko-KR']
];
const langName = c => (LANGS.find(l => l[0] === c) || [c, c])[1];
const langLocale = c => (LANGS.find(l => l[0] === c) || [c, c, c])[2];
const mmCode = c => (LANGS.find(l => l[0] === c) || [])[3] || c;
const NOSPACE = new Set(['zh', 'ja', 'th']);

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------------- state & storage ---------------- */
const DEFAULTS = () => ({
  settings: {native:'en', target:'', rate:0.9, voice:'', provider:'auto', email:'', ltUrl:'', ltKey:'', goal:10, font:22},
  lessons: [], words: {}, cache: {}, stats: {days: {}}
});
let S = DEFAULTS(), memOnly = false, saveTimer = 0;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw), def = DEFAULTS(); S = {...def, ...d, settings: {...def.settings, ...d.settings}, stats: {days: {}, ...d.stats}}; }
  } catch (e) { memOnly = true; }
}
function saveNow() {
  clearTimeout(saveTimer); saveTimer = 0;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) {
    if (Object.keys(S.cache).length) { S.cache = {}; try { localStorage.setItem(KEY, JSON.stringify(S)); return; } catch (e2) {} }
    if (!memOnly) { memOnly = true; toast('Could not save on this device. Export a backup from Settings.'); }
  }
}
function save() { if (!saveTimer) saveTimer = setTimeout(saveNow, 400); }
addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });

const dict = lang => (S.words[lang] ||= {});
const stOf = (lang, k) => { const e = dict(lang)[k]; return e ? e.s : 0; };   // 0 new, 1-3 learning, 4 known, 5 ignored
function bump(field, n = 1) { const d = (S.stats.days[today()] ||= {}); d[field] = (d[field] || 0) + n; save(); }
function streak() {
  let n = 0; const d = new Date();
  if (!S.stats.days[today(d)]) d.setDate(d.getDate() - 1);
  while (S.stats.days[today(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function counts(lang) {
  let known = 0, learning = 0, due = 0; const now = Date.now();
  for (const e of Object.values(dict(lang))) {
    if (e.s === 4) known++; else if (e.s >= 1 && e.s <= 3) { learning++; if ((e.due || 0) <= now) due++; }
  }
  return {known, learning, due};
}

/* ---------------- text segmentation ---------------- */
const segCache = {};
function segmenter(lang, granularity) {
  const k = lang + granularity;
  if (!(k in segCache)) { try { segCache[k] = new Intl.Segmenter(lang, {granularity}); } catch (e) { segCache[k] = null; } }
  return segCache[k];
}
function splitSents(par, lang) {
  const s = segmenter(lang, 'sentence');
  const out = s ? [...s.segment(par)].map(x => x.segment)
    : (par.match(/[^.!?。！？]+[.!?。！？]+["'”’»)\]]*\s*|[^.!?。！？]+$/g) || [par]);
  return out.map(x => x.trim()).filter(Boolean);
}
function tokens(t, lang) {
  const s = segmenter(lang, 'word'), out = [];
  if (s) { for (const x of s.segment(t)) out.push({w: x.segment, o: x.index, word: !!x.isWordLike && /\p{L}/u.test(x.segment)}); return out; }
  let last = 0;
  for (const m of t.matchAll(/[\p{L}\p{M}][\p{L}\p{M}'’-]*/gu)) {
    if (m.index > last) out.push({w: t.slice(last, m.index), o: last, word: false});
    out.push({w: m[0], o: m.index, word: true}); last = m.index + m[0].length;
  }
  if (last < t.length) out.push({w: t.slice(last), o: last, word: false});
  return out;
}
const keyOf = (w, lang) => { try { return w.toLocaleLowerCase(lang); } catch (e) { return w.toLowerCase(); } };
function lessonWords(L) { const out = []; for (const s of L.sents) for (const t of tokens(s.t, L.lang)) if (t.word) out.push(keyOf(t.w, L.lang)); return out; }

/* ---------------- translation ---------------- */
const sessCache = new Map(), devT = {};
function decodeEntities(s) { if (!/&[#\w]+;/.test(s)) return s; const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function chunks(text, max = 450) {
  const enc = new TextEncoder(), size = s => enc.encode(s).length, out = []; let cur = '';
  for (const piece of text.split(/(\s+)/)) {
    if (cur && size(cur + piece) > max) { out.push(cur); cur = ''; }
    if (size(piece) > max) { for (const ch of piece) { if (size(cur + ch) > max) { out.push(cur); cur = ''; } cur += ch; } }
    else cur += piece;
  }
  if (cur.trim()) out.push(cur);
  return out;
}
async function onDevice(text, from, to) {            // Chrome's built-in on-device translator, where available
  if (!('Translator' in self)) return null;
  const k = from + '>' + to;
  const within = (pr, ms) => Promise.race([pr, new Promise(r => setTimeout(() => r(null), ms))]);   // the API can hang; never block on it
  if (!(k in devT)) devT[k] = (async () => {
    try {
      if (await within(self.Translator.availability({sourceLanguage: from, targetLanguage: to}), 2000) !== 'available') return null;
      return await within(self.Translator.create({sourceLanguage: from, targetLanguage: to}), 8000);
    } catch (e) { return null; }
  })();
  const tr = await devT[k];
  if (!tr) return null;
  try { return await tr.translate(text); } catch (e) { return null; }
}
async function myMemory(text, from, to) {
  const out = [];
  for (const part of chunks(text)) {
    const u = new URL('https://api.mymemory.translated.net/get');
    u.searchParams.set('q', part.trim()); u.searchParams.set('langpair', mmCode(from) + '|' + mmCode(to));
    if (S.settings.email) u.searchParams.set('de', S.settings.email);
    let j;
    try { const r = await fetch(u); j = await r.json(); }
    catch (e) { throw new Error(navigator.onLine === false ? 'You are offline — translation needs an internet connection.' : 'Could not reach the translation service.'); }
    const t = j && j.responseData && j.responseData.translatedText;
    const detail = String((j && j.responseDetails) || t || '');
    if (!t || Number(j.responseStatus) !== 200 || /^MYMEMORY WARNING/i.test(t)) {
      if (/WARNING|LIMIT|QUOTA/i.test(detail) || Number(j && j.responseStatus) === 429)
        throw new Error('The free daily translation limit is used up. Add your email in Settings for a 10× higher limit, or try again tomorrow.');
      throw new Error('Translation failed' + (detail ? ': ' + detail.slice(0, 120) : '.'));
    }
    out.push(decodeEntities(t));
  }
  return out.join(' ');
}
async function libre(text, from, to) {
  const base = (S.settings.ltUrl || '').trim().replace(/\/+$/, '').replace(/\/translate$/, '');
  if (!base) throw new Error('Set the LibreTranslate server address in Settings.');
  let r;
  try {
    r = await fetch(base + '/translate', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({q: text, source: from, target: to, format: 'text', api_key: S.settings.ltKey || undefined})});
  } catch (e) { throw new Error('Could not reach the LibreTranslate server.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.translatedText) throw new Error('Translation failed' + (j.error ? ': ' + j.error : ' (' + r.status + ').'));
  return j.translatedText;
}
async function translate(text, from, to) {
  text = text.trim();
  if (!text || from === to) return text;
  const k = from + '|' + to + '|' + text;
  if (S.cache[k]) return S.cache[k];
  if (sessCache.has(k)) return sessCache.get(k);
  const p = S.settings.provider;
  let out = null;
  if (p === 'libre') out = await libre(text, from, to);
  else {
    if (p === 'auto') out = await onDevice(text, from, to);
    if (out == null) out = await myMemory(text, from, to);
  }
  out = out.trim();
  sessCache.set(k, out);
  if (text.length <= 40) { S.cache[k] = out; save(); }   // persist word lookups only
  return out;
}

/* ---------------- speech ---------------- */
const TTS = 'speechSynthesis' in self && 'SpeechSynthesisUtterance' in self;
let voices = [];
function loadVoices() { voices = TTS ? speechSynthesis.getVoices() : []; }
if (TTS) { loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', () => { loadVoices(); if (view === 'settings') render(); }); }
const voicesFor = lang => voices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang));
function pickVoice(lang) {
  const list = voicesFor(lang);
  return list.find(v => v.voiceURI === S.settings.voice) || list.find(v => v.lang.replace('_', '-') === langLocale(lang)) || list[0] || null;
}
const P = {i: 0, playing: false, tok: 0, repeat: false, t0: 0, u: null};
function speak(text, lang, {rate, onend, onboundary, onerror} = {}) {
  if (!TTS) { toast('This browser has no text-to-speech.'); return; }
  const my = ++P.tok;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text), v = pickVoice(lang);
  u.lang = v ? v.lang : langLocale(lang); if (v) u.voice = v;
  u.rate = rate || S.settings.rate;
  u.onboundary = e => { if (my === P.tok && onboundary) onboundary(e); };
  u.onend = () => { if (my === P.tok && onend) onend(); };
  u.onerror = e => { if (my === P.tok && e.error !== 'canceled' && e.error !== 'interrupted' && onerror) onerror(e); };
  P.u = u;                                              // keep a reference: some engines drop events otherwise
  setTimeout(() => { if (my === P.tok) speechSynthesis.speak(u); }, 60);   // speak() right after cancel() can be swallowed
}
function stopSpeech() { P.tok++; if (TTS) speechSynthesis.cancel(); if (P.playing && P.t0) bump('listen', Math.round((Date.now() - P.t0) / 1000)); P.playing = false; P.t0 = 0; }
function playFrom(i) {
  const L = cur(); if (!L) return;
  if (P.playing && P.t0) bump('listen', Math.round((Date.now() - P.t0) / 1000));
  if (i < 0) i = 0;
  if (i >= L.sents.length) { stopSpeech(); drawPlayer(); return; }
  P.i = i; P.playing = true; P.t0 = Date.now();
  markSentence(i, true); drawPlayer();
  if (!voicesFor(L.lang).length && voices.length && !P.warned) { P.warned = true; toast('No ' + langName(L.lang) + ' voice found on this device — install one in your system text-to-speech settings for natural audio.'); }
  speak(L.sents[i].t, L.lang, {
    onboundary: e => markSpoken(i, e.charIndex),

/* ---------------- lesson creation ---------------- */
async function pool(items, n, fn) {
  let idx = 0;
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => { while (idx < items.length) { const i = idx++; await fn(items[i], i); } }));
}
async function createLesson() {
  if (A.busy) return;
  const title = $('#a-title').value.trim(), text = $('#a-text').value.trim();
  A.title = title; A.text = text;
  if (!text) { toast('Paste some text first.'); return; }
  const {native, target} = S.settings, srcLang = A.native ? native : target;
  const src = [];
  text.split(/\n+/).map(p => p.trim()).filter(Boolean).forEach(p => splitSents(p, srcLang).forEach((s, i) => src.push({s, p: i === 0})));
  let sents;
  if (!A.native) sents = src.map(x => ({t: x.s, tr: '', p: x.p}));
  else {
    A.busy = true; A.abort = false; A.done = 0; A.total = src.length; render();
    const out = new Array(src.length);
    try {
      await pool(src, 3, async (x, i) => {
        if (A.abort) throw new Error('Cancelled.');
        out[i] = {t: await translate(x.s, native, target), tr: x.s, p: x.p};
        A.done++; const pr = $('progress'); if (pr) { pr.value = A.done; pr.nextElementSibling.firstChild.textContent = `Translating sentence ${A.done} of ${A.total}… `; }
      });
    } catch (e) { A.busy = false; A.abort = true; if (view === 'add') render(); toast(e.message + (e.message === 'Cancelled.' ? '' : ' Finished sentences are kept — press the button again to resume.')); return; }
    A.busy = false; sents = out;
  }
  const L = {id: uid(), lang: target, title: title || sents[0].t.slice(0, 60), sents, created: Date.now(), pos: 0, done: false};
  L.wc = lessonWords(L).length;
  S.lessons.push(L); saveNow();
  A.title = A.text = '';
  openLesson(L.id);
}
function openLesson(id) { R.id = id; R.lines = false; R.sel = null; P.i = (cur() || {}).pos || 0; P.playing = false; go('reader'); }
function finishLesson() {
  const L = cur(); if (!L) return;
  const d = dict(L.lang), words = lessonWords(L), fresh = [...new Set(words)].filter(k => !d[k]);
  if (fresh.length && !confirm(`Mark the ${fresh.length} remaining blue word${fresh.length === 1 ? '' : 's'} as known?`)) return;
  fresh.forEach(k => d[k] = {s: 4});
  if (fresh.length) bump('known', fresh.length);
  bump('read', words.length);
  L.done = true; saveNow();
  toast(`Lesson finished — ${fresh.length} word${fresh.length === 1 ? '' : 's'} added to your known words.`);
  go('library');
}

/* ---------------- review (spaced repetition) ---------------- */
function startReview(all) {
  const t = S.settings.target, now = Date.now();
  RV.queue = Object.entries(dict(t)).filter(([, e]) => e.s >= 1 && e.s <= 3 && (all || (e.due || 0) <= now))
    .sort((a, b) => (a[1].due || 0) - (b[1].due || 0)).slice(0, 30).map(([k]) => k);
  RV.shown = false; RV.done = 0; RV.active = RV.queue.length > 0;
}
function vReview() {
  const t = S.settings.target, c = counts(t);
  if (!RV.active || !RV.queue.length) {
    const finished = RV.active; RV.active = false;
    return `<div class="top"><h1>Review</h1></div><div class="card empty">
      ${finished ? `<p><b>Session complete</b> — ${RV.done} card${RV.done === 1 ? '' : 's'} reviewed.</p>` : ''}
      <p>${c.due ? `${c.due} word${c.due === 1 ? ' is' : 's are'} due for review.` : c.learning ? 'Nothing is due right now. Reading more is the best review.' : 'Words you tap while reading show up here for review.'}</p>
      <div class="row" style="justify-content:center">${c.due ? '<button class="btn primary" data-a="review">Start review</button>' : ''}
      ${c.learning ? '<button class="btn" data-a="review" data-all="1">Practise all learning words</button>' : ''}</div></div>`;
  }
  const k = RV.queue[0], e = dict(t)[k];
  const ctx = e.ctx ? esc(e.ctx).replace(new RegExp('(^|[^\\p{L}])(' + esc(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\p{L}])', 'giu'), '$1<b>$2</b>') : '';
  return `<div class="top"><h1 class="grow">Review</h1><span class="pill">${RV.queue.length} left</span><button class="btn" data-a="endReview">End</button></div>
  <div class="card flash"><div class="word" lang="${esc(t)}">${esc(k)}</div>
    <div><button class="mini" data-a="sayCard" aria-label="Listen">🔊</button></div>
    ${ctx ? `<div class="ctx" lang="${esc(t)}">${ctx}</div>` : ''}
    ${RV.shown ? `<div class="mean">${esc(e.tr || '(no meaning saved)')}</div>` : ''}</div>
  ${RV.shown ? `<div class="grade">
      <button class="btn" data-a="grade" data-g="again">Again<small>forgot</small></button>
      <button class="btn" data-a="grade" data-g="hard">Hard<small>${fmtIvl(Math.max(1, (e.ivl || 1) * 1.2))}</small></button>
      <button class="btn" data-a="grade" data-g="good">Good<small>${fmtIvl(Math.max(2, (e.ivl || 1) * 2.5))}</small></button>
      <button class="btn" data-a="grade" data-g="known">Known<small>stop reviewing</small></button></div>`
    : '<button class="btn primary" data-a="reveal" style="width:100%">Show meaning</button>'}`;
}
const fmtIvl = d => d < 30 ? Math.round(d) + ' d' : Math.round(d / 30) + ' mo';
function grade(g) {
  const t = S.settings.target, k = RV.queue.shift(), e = dict(t)[k]; if (!e) return;
  const now = Date.now();
  if (g === 'again') { e.s = 1; e.ivl = 1; e.due = now + 10 * 60e3; RV.queue.push(k); }
  else if (g === 'hard') { e.ivl = Math.max(1, (e.ivl || 1) * 1.2); e.due = now + e.ivl * DAY; }
  else if (g === 'good') { e.ivl = Math.max(2, (e.ivl || 1) * 2.5); e.due = now + e.ivl * DAY; e.s = Math.min(3, e.s + 1); }
  else { e.s = 4; bump('known'); }
  if (g !== 'again') RV.done++;
  bump('reviews'); RV.shown = false; save(); render();
}

  const opts = [['all', 'All'], ['learning', 'Learning'], ['1', 'New'], ['2', 'Seen'], ['3', 'Familiar'], ['4', 'Known'], ['5', 'Ignored']];
  return `<div class="top"><h1 class="grow">Words</h1><button class="btn" data-a="csv">Export CSV</button></div>
  <div class="row" style="margin-bottom:8px"><input id="w-q" placeholder="Search…" value="${esc(WF.q)}" style="flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)">
    <select id="w-st" style="padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:44px">${opts.map(([v, n]) => `<option value="${v}" ${WF.st === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
  <div class="card" id="w-list" style="padding-top:4px;padding-bottom:4px">${wordRows()}</div>`;
}
function vStats() {
  const t = S.settings.target, c = counts(t), days = S.stats.days;
  let read = 0, listen = 0, reviews = 0;
  for (const d of Object.values(days)) { read += d.read || 0; listen += d.listen || 0; reviews += d.reviews || 0; }
  const cells = []; const d = new Date(); d.setDate(d.getDate() - 27);
  for (let i = 0; i < 28; i++, d.setDate(d.getDate() + 1)) cells.push(`<i class="${days[today(d)] ? 'a' : ''}" title="${today(d)}">${d.getDate()}</i>`);
  const td = days[today()] || {};
  return `<div class="top"><h1 class="grow">Progress</h1><span class="pill">${esc(langName(t))}</span></div>
  <div class="tiles">
    <div class="tile"><b>${c.known}</b><span>known words</span></div>
    <div class="tile"><b>${c.learning}</b><span>words being learned</span></div>
    <div class="tile"><b>${streak()}</b><span>day streak</span></div>
    <div class="tile"><b>${read}</b><span>words read</span></div>
    <div class="tile"><b>${Math.round(listen / 60)}</b><span>minutes listened</span></div>
    <div class="tile"><b>${reviews}</b><span>cards reviewed</span></div>
  </div>
  <div class="card"><h2>Today</h2><div class="muted">${td.saved || 0} of ${S.settings.goal} new words saved · ${td.known || 0} words learned · ${td.read || 0} words read · ${Math.round((td.listen || 0) / 60)} min listened</div>
    <progress max="${S.settings.goal}" value="${Math.min(td.saved || 0, S.settings.goal)}" style="margin-top:10px"></progress></div>
  <div class="card"><h2>Last 4 weeks</h2><div class="days">${cells.join('')}</div></div>
  <div class="card"><h2>How to learn with Storyglot</h2><ol class="muted" style="margin:0;padding-left:20px">
    <li>Pick texts you find interesting, slightly above your level (roughly 5–20% new words).</li>
    <li>Listen while you read. Replay sentences, slow the voice down, loop hard ones.</li>
    <li>Tap words you don't know. They turn yellow and fade as you get to know them.</li>
    <li>Finish the lesson — everything you didn't tap counts as known. Watch your known-word count grow.</li>
    <li>Don't try to memorise. Review a little, then read and listen more: words stick by meeting them again in new contexts.</li></ol></div>`;
}
function vSettings() {
  const s = S.settings, vs = voicesFor(s.target);
  return `<div class="top"><h1>Settings</h1></div>
  <div class="card"><h2>Languages</h2>
    <label class="f">I speak<select id="s-native">${langOptions(s.native)}</select></label>
    <label class="f">I am learning<select id="s-target">${langOptions(s.target)}</select></label>
    <label class="f">Daily goal (new words saved)<input id="s-goal" type="number" min="1" max="200" value="${s.goal}"></label></div>
  <div class="card"><h2>Voice</h2>
    ${!TTS ? '<p class="muted">This browser does not support text-to-speech.</p>' : `
    <label class="f">${esc(langName(s.target))} voice<select id="s-voice"><option value="">Automatic</option>${vs.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI === s.voice ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})${v.localService ? ' · offline' : ''}</option>`).join('')}</select></label>
    ${vs.length ? '' : `<p class="muted">No ${esc(langName(s.target))} voice was found. Install one in your tablet's settings (Android: Settings → Accessibility → Text-to-speech → install voice data; iPad: Settings → Accessibility → Spoken Content → Voices), then reopen the app.</p>`}
    <label class="f">Speed: <span id="s-rate-v">${s.rate}×</span><input id="s-rate" type="range" min="0.5" max="1.5" step="0.05" value="${s.rate}"></label>
    <button class="btn" data-a="testVoice">Test voice</button>`}</div>
  <div class="card"><h2>Translation</h2>
    <label class="f">Service<select id="s-prov">
      <option value="auto" ${s.provider === 'auto' ? 'selected' : ''}>Automatic (on-device if the browser has it installed, otherwise MyMemory)</option>
      <option value="mymemory" ${s.provider === 'mymemory' ? 'selected' : ''}>MyMemory (free, online)</option>
      <option value="libre" ${s.provider === 'libre' ? 'selected' : ''}>LibreTranslate server (your own or hosted)</option></select></label>
    ${s.provider === 'libre' ? `<label class="f">Server address<input id="s-lturl" placeholder="https://…" value="${esc(s.ltUrl)}"></label>
      <label class="f">API key (if required)<input id="s-ltkey" value="${esc(s.ltKey)}" autocomplete="off"></label>`
    : `<label class="f">Email for MyMemory (optional)<input id="s-email" type="email" value="${esc(s.email)}" placeholder="raises the free limit from ~5,000 to ~50,000 characters a day"></label>
      <p class="muted" style="margin:0">Text you translate is sent to mymemory.translated.net${s.email ? ' together with this email address' : ''}. Reading, audio, word tracking and review work offline.</p>`}</div>
  <div class="card"><h2>Your data</h2><p class="muted" style="margin-top:0">Everything is stored only on this device, in this browser.</p>
    <div class="row"><button class="btn" data-a="backup">Export backup</button>
      <label class="btn" style="display:inline-flex;align-items:center">Import backup<input type="file" id="s-import" accept=".json,application/json" hidden></label>
      <button class="btn danger" data-a="reset">Erase everything</button></div></div>`;
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------------- events ---------------- */
const ACT = {
  go: el => go(el.dataset.v),
  start() { const n = $('#w-native').value, t = $('#w-target').value; if (n === t) return toast('Choose two different languages.'); S.settings.native = n; S.settings.target = t; saveNow(); navigator.storage?.persist?.().catch(() => {}); go('library'); },
  open: el => openLesson(el.dataset.id),
  delLesson(el) { const L = S.lessons.find(l => l.id === el.dataset.id); if (L && confirm(`Delete “${L.title}”? Your saved words are kept.`)) { S.lessons = S.lessons.filter(l => l !== L); saveNow(); render(); } },
  addMode(el) { A.title = $('#a-title').value; A.text = $('#a-text').value; A.native = !!el.dataset.n; render(); },
  create: createLesson,
  cancelCreate() { A.abort = true; },
  lines() { R.lines = !R.lines; closeSheet(); render(); if (P.playing) markSentence(P.i, true); },
  font(el) { S.settings.font = Math.max(14, Math.min(40, S.settings.font + +el.dataset.d)); applyFont(); save(); },
  finish: finishLesson,
  toggle() { if (P.playing) { stopSpeech(); drawPlayer(); } else playFrom(P.i); },
  prev() { P.playing ? playFrom(P.i - 1) : (P.i = Math.max(0, P.i - 1), markSentence(P.i, true), drawPlayer()); },
  next() { const n = cur().sents.length - 1; P.playing ? playFrom(P.i + 1) : (P.i = Math.min(n, P.i + 1), markSentence(P.i, true), drawPlayer()); },
  repeat() { P.repeat = !P.repeat; drawPlayer(); },
  playSent(el) { if (view !== 'reader') return; playFrom(+el.dataset.i); },
  trSent: el => trSent(+el.dataset.i),
  async trAll() { const L = cur(), idx = L.sents.map((s, i) => s.tr ? -1 : i).filter(i => i >= 0); try { await pool(idx, 3, async i => { const s = L.sents[i]; s.tr = await translate(s.t, L.lang, S.settings.native); const el = $('.tr[data-i="' + i + '"]'); if (el) el.textContent = s.tr; }); } catch (e) { toast(e.message); } saveNow(); if (view === 'reader' && cur() === L) { const y = scrollY; render(); scrollTo(0, y); } },
  closeSheet,
  sayWord() { if (!R.sel) return; if (P.playing) { stopSpeech(); drawPlayer(); } speak(R.sel.surface, R.sel.lang, {rate: Math.min(S.settings.rate, 0.9)}); },
  setSt(el) { if (!R.sel) return; setStatus(R.sel.lang, R.sel.k, +el.dataset.s); drawSheet(); if (view === 'words') { $('#w-list').innerHTML = wordRows(); } },
  review(el) { startReview(!!el.dataset.all); render(); },
  endReview() { RV.active = false; RV.queue = []; render(); },
  reveal() { RV.shown = true; render(); },
  sayCard() { speak(RV.queue[0], S.settings.target, {rate: Math.min(S.settings.rate, 0.9)}); },
  grade: el => grade(el.dataset.g),
  wordRow(el) { const k = el.dataset.k; R.sel = {lang: S.settings.target, k, surface: k, i: null, busy: false, err: ''}; drawSheet(); },
  csv() { const q = s => '"' + String(s || '').replace(/"/g, '""') + '"'; const t = S.settings.target;
    const rows = Object.entries(dict(t)).filter(([, e]) => e.s >= 1 && e.s <= 3).map(([k, e]) => [k, e.tr, e.ctx].map(q).join(','));
    if (!rows.length) return toast('No learning words to export yet.');
    download(`storyglot-${t}-words.csv`, '﻿' + rows.join('\r\n'), 'text/csv'); },
  testVoice() { const t = S.settings.target; const L = S.lessons.find(l => l.lang === t); speak(L ? L.sents[0].t : langName(t), t); },
  backup() { saveNow(); download(`storyglot-backup-${today()}.json`, JSON.stringify(S), 'application/json'); },
  reset() { if (confirm('Erase all lessons, words and progress on this device? This cannot be undone.')) { S = DEFAULTS(); saveNow(); go('welcome'); } }
};
document.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (w && view === 'reader') {
    const L = cur(), s = w.closest('.s');
    document.querySelectorAll('.w.sel').forEach(x => x.classList.remove('sel')); w.classList.add('sel');
    openWord(L.lang, w.dataset.k, w.textContent, s ? +s.dataset.i : null);
    return;
  }
  const el = e.target.closest('[data-a]');
  if (el) { const f = ACT[el.dataset.a]; if (f) { if (el.closest('.lesson') && el.dataset.a !== 'open') e.stopPropagation(); f(el); } return; }
  if (R.sel && !e.target.closest('#sheet') && !e.target.closest('#player')) closeSheet();
}, true);
document.addEventListener('change', e => {
  const t = e.target, s = S.settings;
  switch (t.id) {
    case 'p-rate': s.rate = +t.value; save(); if (P.playing) playFrom(P.i); break;
    case 's-native': if (t.value === s.target) { toast('Choose two different languages.'); render(); break; } s.native = t.value; saveNow(); break;
    case 's-target': if (t.value === s.native) { toast('Choose two different languages.'); render(); break; } s.target = t.value; s.voice = ''; RV.active = false; saveNow(); render(); break;
    case 's-goal': s.goal = Math.max(1, Math.min(200, Math.round(+t.value) || 10)); save(); break;
    case 's-voice': s.voice = t.value; save(); break;
    case 's-rate': s.rate = +t.value; save(); break;
    case 's-prov': s.provider = t.value; saveNow(); render(); break;
    case 's-email': s.email = t.value.trim(); save(); break;
    case 's-lturl': s.ltUrl = t.value.trim(); save(); break;
    case 's-ltkey': s.ltKey = t.value.trim(); save(); break;
    case 'w-st': WF.st = t.value; $('#w-list').innerHTML = wordRows(); break;
    case 's-mean': if (R.sel) { const e2 = dict(R.sel.lang)[R.sel.k]; if (e2) { e2.tr = t.value.trim(); save(); if (view === 'words') $('#w-list').innerHTML = wordRows(); } } break;
    case 'a-file': { const f = t.files[0]; if (!f) break; f.text().then(txt => { A.text = txt; A.title = $('#a-title').value || f.name.replace(/\.[^.]+$/, ''); render(); }); break; }
    case 's-import': { const f = t.files[0]; if (!f) break; f.text().then(txt => {
      try { const d = JSON.parse(txt); if (!d || !d.settings || !Array.isArray(d.lessons)) throw 0;
        if (!confirm('Replace everything on this device with this backup?')) return;
        const def = DEFAULTS(); S = {...def, ...d, settings: {...def.settings, ...d.settings}, stats: {days: {}, ...d.stats}}; saveNow(); go('library'); toast('Backup restored.');
      } catch (err) { toast('That file is not a Storyglot backup.'); } }); break; }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'w-q') { WF.q = e.target.value; $('#w-list').innerHTML = wordRows(); }
  if (e.target.id === 's-rate') $('#s-rate-v').textContent = (+e.target.value).toFixed(2).replace(/0$/, '') + '×';
});

/* ---------------- boot ---------------- */
load();
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
